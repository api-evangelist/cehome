aid: cehome
name: cehome
description: >-
  cehome (铁甲工程机械网, "Tiejia") is a Chinese digital platform for the construction
  and engineering machinery industry, operated at cehome.com and m.cehome.com. It is a
  professional information hub and community serving equipment owners, operators, dealers,
  and manufacturers: industry news and price data, product reviews, buying guides and
  detailed product listings across brands (Sany, Caterpillar, Komatsu, Doosan, and others)
  and equipment types (excavators, loaders, bulldozers, cranes), a used-machinery
  marketplace, operator job listings, and the active 铁甲论坛 community forum. cehome is a
  consumer/community web platform rather than an API provider; it publishes no public
  developer portal, OpenAPI, or programmatic API surface. It was surfaced as a portfolio
  company of the venture firm Qiming and added to the API Evangelist network for enrichment.
